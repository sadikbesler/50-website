    <!-- S9 · tab "tabs-box" + fieldset/input + range + join (radio btn) · sonuçlar stat içinde (tools.js) -->
    <section id="araclar" class="{{c:sec}}" aria-labelledby="tools-title">
      <div class="{{c:wrap}}">
        <header class="{{c:head}}">
          <h2 id="tools-title" class="{{c:h2}}" data-i18n="tools.title">Hesaplama araçları</h2>
          <p class="{{c:lede}}" data-i18n="tools.lede">Bu hesaplamalar genel bir fikir verir. Görüşmede aynı değerleri vücut analizi ve tahlillerinizle birlikte yorumluyoruz.</p>
        </header>

        <div class="flex justify-center">
          <div role="tablist" class="tabs tabs-box" data-i18n-attr="aria-label:tools.aria" aria-label="Sağlık hesaplama araçları">
            <button role="tab" type="button" class="tab" id="tab-bmi" aria-controls="tool-bmi" aria-selected="true"><span class="hidden sm:inline" data-i18n="tools.tab1">Vücut kitle indeksi</span><span class="sm:hidden" data-i18n="tools.tab1abbr">VKİ</span></button>
            <button role="tab" type="button" class="tab" id="tab-kcal" aria-controls="tool-kcal" aria-selected="false" tabindex="-1"><span data-i18n="tools.tab2">Günlük kalori</span></button>
            <button role="tab" type="button" class="tab" id="tab-water" aria-controls="tool-water" aria-selected="false" tabindex="-1"><span data-i18n="tools.tab3">Su ihtiyacı</span></button>
          </div>
        </div>

        <!-- VKİ -->
        <div class="tool mt-8 grid items-start gap-6 lg:grid-cols-2" role="tabpanel" id="tool-bmi" aria-labelledby="tab-bmi">
          <form class="fieldset rounded-box border border-base-300 bg-base-200 p-4" data-tool="bmi" novalidate>
            <label class="fieldset-legend" for="bmi-height" data-i18n="tools.height">Boy</label>
            <label class="input w-full"><input id="bmi-height" name="height" type="number" inputmode="decimal" min="120" max="220" step="1" value="168" class="grow"><span class="label">cm</span></label>
            <input type="range" class="range range-sm w-full" min="120" max="220" step="1" value="168" data-sync="height" data-i18n-attr="aria-label:tools.height" aria-label="Boy">
            <label class="fieldset-legend mt-2" for="bmi-weight" data-i18n="tools.weight">Kilo</label>
            <label class="input w-full"><input id="bmi-weight" name="weight" type="number" inputmode="decimal" min="35" max="220" step="0.1" value="68" class="grow"><span class="label">kg</span></label>
            <input type="range" class="range range-sm w-full" min="35" max="200" step="0.5" value="68" data-sync="weight" data-i18n-attr="aria-label:tools.weight" aria-label="Kilo">
            <p class="label mt-2 whitespace-normal" data-i18n="tools.bmiNote">VKİ; 18 yaş altı, gebelik dönemi ve kas kütlesi yüksek sporcular için yanıltıcı olabilir.</p>
          </form>
          <div class="tool-result stats stats-vertical w-full bg-base-100 shadow" data-result="bmi" aria-live="polite"></div>
        </div>

        <!-- Günlük kalori -->
        <div class="tool mt-8 grid items-start gap-6 lg:grid-cols-2" role="tabpanel" id="tool-kcal" aria-labelledby="tab-kcal" hidden>
          <form class="fieldset rounded-box border border-base-300 bg-base-200 p-4" data-tool="kcal" novalidate>
            <fieldset class="fieldset">
              <legend class="fieldset-legend" data-i18n="tools.sex">Cinsiyet</legend>
              <div class="join">
                <input class="btn join-item" type="radio" name="sex" value="f" aria-label="Kadın" data-i18n-attr="aria-label:tools.female" checked>
                <input class="btn join-item" type="radio" name="sex" value="m" aria-label="Erkek" data-i18n-attr="aria-label:tools.male">
              </div>
            </fieldset>
            <div class="grid gap-x-3 sm:grid-cols-3">
              <div>
                <label class="fieldset-legend" for="kcal-age" data-i18n="tools.age">Yaş</label>
                <label class="input w-full"><input id="kcal-age" name="age" type="number" inputmode="numeric" min="18" max="90" value="32" class="grow"><span class="label" data-i18n="tools.years">yaş</span></label>
              </div>
              <div>
                <label class="fieldset-legend" for="kcal-height" data-i18n="tools.height">Boy</label>
                <label class="input w-full"><input id="kcal-height" name="height" type="number" inputmode="decimal" min="120" max="220" value="168" class="grow"><span class="label">cm</span></label>
              </div>
              <div>
                <label class="fieldset-legend" for="kcal-weight" data-i18n="tools.weight">Kilo</label>
                <label class="input w-full"><input id="kcal-weight" name="weight" type="number" inputmode="decimal" min="35" max="220" step="0.1" value="68" class="grow"><span class="label">kg</span></label>
              </div>
            </div>
            <label class="fieldset-legend" for="kcal-activity" data-i18n="tools.activity">Hareket düzeni</label>
            <select class="select w-full" id="kcal-activity" name="activity">
              <option value="1.2" data-i18n="tools.act1">Hareketsiz (masa başı, egzersiz yok)</option>
              <option value="1.375" data-i18n="tools.act2">Hafif aktif (haftada 1–3 gün)</option>
              <option value="1.55" selected data-i18n="tools.act3">Orta aktif (haftada 3–5 gün)</option>
              <option value="1.725" data-i18n="tools.act4">Çok aktif (haftada 6–7 gün)</option>
              <option value="1.9" data-i18n="tools.act5">Ekstra aktif (ağır iş veya günde iki antrenman)</option>
            </select>
            <fieldset class="fieldset">
              <legend class="fieldset-legend" data-i18n="tools.goal">Hedef</legend>
              <div class="join">
                <input class="btn join-item" type="radio" name="goal" value="lose" aria-label="Kilo vermek" data-i18n-attr="aria-label:tools.lose" checked>
                <input class="btn join-item" type="radio" name="goal" value="keep" aria-label="Korumak" data-i18n-attr="aria-label:tools.keep">
                <input class="btn join-item" type="radio" name="goal" value="gain" aria-label="Kilo almak" data-i18n-attr="aria-label:tools.gain">
              </div>
            </fieldset>
          </form>
          <div class="tool-result stats stats-vertical w-full bg-base-100 shadow" data-result="kcal" aria-live="polite"></div>
        </div>

        <!-- Su -->
        <div class="tool mt-8 grid items-start gap-6 lg:grid-cols-2" role="tabpanel" id="tool-water" aria-labelledby="tab-water" hidden>
          <form class="fieldset rounded-box border border-base-300 bg-base-200 p-4" data-tool="water" novalidate>
            <label class="fieldset-legend" for="water-weight" data-i18n="tools.weight">Kilo</label>
            <label class="input w-full"><input id="water-weight" name="weight" type="number" inputmode="decimal" min="35" max="220" step="0.1" value="68" class="grow"><span class="label">kg</span></label>
            <input type="range" class="range range-sm w-full" min="35" max="200" step="0.5" value="68" data-sync="weight" data-i18n-attr="aria-label:tools.weight" aria-label="Kilo">
            <label class="fieldset-legend mt-2" for="water-exercise" data-i18n="tools.exercise">Günlük egzersiz</label>
            <label class="input w-full"><input id="water-exercise" name="exercise" type="number" inputmode="numeric" min="0" max="240" step="5" value="30" class="grow"><span class="label" data-i18n="tools.min">dk</span></label>
            <input type="range" class="range range-sm w-full" min="0" max="180" step="15" value="30" data-sync="exercise" data-i18n-attr="aria-label:tools.exercise" aria-label="Günlük egzersiz">
            <fieldset class="fieldset">
              <legend class="fieldset-legend" data-i18n="tools.climate">Hava</legend>
              <div class="join">
                <input class="btn join-item" type="radio" name="climate" value="normal" aria-label="Normal" data-i18n-attr="aria-label:tools.normal" checked>
                <input class="btn join-item" type="radio" name="climate" value="hot" aria-label="Sıcak / nemli" data-i18n-attr="aria-label:tools.hot">
              </div>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend" data-i18n="tools.status">Özel durum</legend>
              <div class="join">
                <input class="btn join-item" type="radio" name="status" value="none" aria-label="Yok" data-i18n-attr="aria-label:tools.none" checked>
                <input class="btn join-item" type="radio" name="status" value="pregnant" aria-label="Gebelik" data-i18n-attr="aria-label:tools.pregnant">
                <input class="btn join-item" type="radio" name="status" value="nursing" aria-label="Emzirme" data-i18n-attr="aria-label:tools.nursing">
              </div>
            </fieldset>
          </form>
          <div class="tool-result stats stats-vertical w-full bg-base-100 shadow" data-result="water" aria-live="polite"></div>
        </div>
      </div>
    </section>
