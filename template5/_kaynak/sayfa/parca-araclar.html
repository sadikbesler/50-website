    <!-- S9 · components/tabs "Tabs with underline" + forms/input-field + forms/range + forms/radio "Bordered" · sonuç: components/card "Default card"
         Sekme davranışı tools.js'te (role=tab, aria-selected); Flowbite tabs data-* nitelikleri kullanılmadı. -->
    <section id="araclar" class="bg-gray-50 dark:bg-gray-800" aria-labelledby="tools-title">
      <div class="{{c:wrap}}">
        <div class="{{c:head}}">
          <h2 id="tools-title" class="{{c:h2}}" data-i18n="tools.title">Hesaplama araçları</h2>
          <p class="{{c:lede}}" data-i18n="tools.lede">Bu hesaplamalar genel bir fikir verir. Görüşmede aynı değerleri vücut analizi ve tahlillerinizle birlikte yorumluyoruz.</p>
        </div>

        <div class="mx-auto max-w-5xl">
          <div class="{{c:tabsWrap}} mb-6">
            <div role="tablist" class="flex flex-wrap -mb-px" data-i18n-attr="aria-label:tools.aria" aria-label="Sağlık hesaplama araçları">
              <button role="tab" type="button" id="tab-bmi" aria-controls="tool-bmi" aria-selected="true" class="me-2 {{c:tab}}"><span class="hidden sm:inline" data-i18n="tools.tab1">Vücut kitle indeksi</span><span class="sm:hidden" data-i18n="tools.tab1abbr">VKİ</span></button>
              <button role="tab" type="button" id="tab-kcal" aria-controls="tool-kcal" aria-selected="false" tabindex="-1" class="me-2 {{c:tab}}"><span data-i18n="tools.tab2">Günlük kalori</span></button>
              <button role="tab" type="button" id="tab-water" aria-controls="tool-water" aria-selected="false" tabindex="-1" class="{{c:tab}}"><span data-i18n="tools.tab3">Su ihtiyacı</span></button>
            </div>
          </div>

          <!-- BMI -->
          <div class="tool grid gap-8 lg:grid-cols-2" role="tabpanel" id="tool-bmi" aria-labelledby="tab-bmi">
            <form class="space-y-6" data-tool="bmi" novalidate>
              <div>
                <div class="flex items-end justify-between gap-4 mb-2.5">
                  <label class="{{c:label}} mb-0" for="bmi-height" data-i18n="tools.height">Boy</label>
                  <div class="relative w-32">
                    <input class="{{c:input}} pe-10" id="bmi-height" name="height" type="number" inputmode="decimal" min="120" max="220" step="1" value="168">
                    <span class="absolute inset-y-0 end-0 grid w-10 place-content-center text-sm text-gray-500 dark:text-gray-300">cm</span>
                  </div>
                </div>
                <input type="range" min="120" max="220" step="1" value="168" data-sync="height" data-i18n-attr="aria-label:tools.height" aria-label="Boy" class="{{c:range}}">
              </div>
              <div>
                <div class="flex items-end justify-between gap-4 mb-2.5">
                  <label class="{{c:label}} mb-0" for="bmi-weight" data-i18n="tools.weight">Kilo</label>
                  <div class="relative w-32">
                    <input class="{{c:input}} pe-10" id="bmi-weight" name="weight" type="number" inputmode="decimal" min="35" max="220" step="0.1" value="68">
                    <span class="absolute inset-y-0 end-0 grid w-10 place-content-center text-sm text-gray-500 dark:text-gray-300">kg</span>
                  </div>
                </div>
                <input type="range" min="35" max="200" step="0.5" value="68" data-sync="weight" data-i18n-attr="aria-label:tools.weight" aria-label="Kilo" class="{{c:range}}">
              </div>
              <p class="tool-note" data-i18n="tools.bmiNote">VKİ; 18 yaş altı, gebelik dönemi ve kas kütlesi yüksek sporcular için yanıltıcı olabilir.</p>
            </form>
            <div class="tool-result grid content-start gap-4 {{c:cardPad}}" data-result="bmi" aria-live="polite"></div>
          </div>

          <!-- Calories -->
          <div class="tool grid gap-8 lg:grid-cols-2" role="tabpanel" id="tool-kcal" aria-labelledby="tab-kcal" hidden>
            <form class="space-y-6" data-tool="kcal" novalidate>
              <fieldset>
                <legend class="{{c:label}}" data-i18n="tools.sex">Cinsiyet</legend>
                <div class="grid grid-cols-2 gap-3">
                  <label class="{{c:radioB}}"><input type="radio" name="sex" value="f" class="{{c:radioBIn}}" checked><span class="{{c:radioBTx}}" data-i18n="tools.female">Kadın</span></label>
                  <label class="{{c:radioB}}"><input type="radio" name="sex" value="m" class="{{c:radioBIn}}"><span class="{{c:radioBTx}}" data-i18n="tools.male">Erkek</span></label>
                </div>
              </fieldset>
              <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
                <div>
                  <label class="{{c:label}}" for="kcal-age" data-i18n="tools.age">Yaş</label>
                  <div class="relative">
                    <input class="{{c:input}} pe-10" id="kcal-age" name="age" type="number" inputmode="numeric" min="18" max="90" value="32">
                    <span class="absolute inset-y-0 end-0 grid w-10 place-content-center text-sm text-gray-500 dark:text-gray-300" data-i18n="tools.years">yaş</span>
                  </div>
                </div>
                <div>
                  <label class="{{c:label}}" for="kcal-height" data-i18n="tools.height">Boy</label>
                  <div class="relative">
                    <input class="{{c:input}} pe-10" id="kcal-height" name="height" type="number" inputmode="decimal" min="120" max="220" value="168">
                    <span class="absolute inset-y-0 end-0 grid w-10 place-content-center text-sm text-gray-500 dark:text-gray-300">cm</span>
                  </div>
                </div>
                <div>
                  <label class="{{c:label}}" for="kcal-weight" data-i18n="tools.weight">Kilo</label>
                  <div class="relative">
                    <input class="{{c:input}} pe-10" id="kcal-weight" name="weight" type="number" inputmode="decimal" min="35" max="220" step="0.1" value="68">
                    <span class="absolute inset-y-0 end-0 grid w-10 place-content-center text-sm text-gray-500 dark:text-gray-300">kg</span>
                  </div>
                </div>
              </div>
              <div>
                <label class="{{c:label}}" for="kcal-activity" data-i18n="tools.activity">Hareket düzeni</label>
                <select class="{{c:input}}" id="kcal-activity" name="activity">
                  <option value="1.2" data-i18n="tools.act1">Hareketsiz (masa başı, egzersiz yok)</option>
                  <option value="1.375" data-i18n="tools.act2">Hafif aktif (haftada 1–3 gün)</option>
                  <option value="1.55" selected data-i18n="tools.act3">Orta aktif (haftada 3–5 gün)</option>
                  <option value="1.725" data-i18n="tools.act4">Çok aktif (haftada 6–7 gün)</option>
                  <option value="1.9" data-i18n="tools.act5">Ekstra aktif (ağır iş veya günde iki antrenman)</option>
                </select>
              </div>
              <fieldset>
                <legend class="{{c:label}}" data-i18n="tools.goal">Hedef</legend>
                <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
                  <label class="{{c:radioB}}"><input type="radio" name="goal" value="lose" class="{{c:radioBIn}}" checked><span class="{{c:radioBTx}}" data-i18n="tools.lose">Kilo vermek</span></label>
                  <label class="{{c:radioB}}"><input type="radio" name="goal" value="keep" class="{{c:radioBIn}}"><span class="{{c:radioBTx}}" data-i18n="tools.keep">Korumak</span></label>
                  <label class="{{c:radioB}}"><input type="radio" name="goal" value="gain" class="{{c:radioBIn}}"><span class="{{c:radioBTx}}" data-i18n="tools.gain">Kilo almak</span></label>
                </div>
              </fieldset>
            </form>
            <div class="tool-result grid content-start gap-4 {{c:cardPad}}" data-result="kcal" aria-live="polite"></div>
          </div>

          <!-- Water -->
          <div class="tool grid gap-8 lg:grid-cols-2" role="tabpanel" id="tool-water" aria-labelledby="tab-water" hidden>
            <form class="space-y-6" data-tool="water" novalidate>
              <div>
                <div class="flex items-end justify-between gap-4 mb-2.5">
                  <label class="{{c:label}} mb-0" for="water-weight" data-i18n="tools.weight">Kilo</label>
                  <div class="relative w-32">
                    <input class="{{c:input}} pe-10" id="water-weight" name="weight" type="number" inputmode="decimal" min="35" max="220" step="0.1" value="68">
                    <span class="absolute inset-y-0 end-0 grid w-10 place-content-center text-sm text-gray-500 dark:text-gray-300">kg</span>
                  </div>
                </div>
                <input type="range" min="35" max="200" step="0.5" value="68" data-sync="weight" data-i18n-attr="aria-label:tools.weight" aria-label="Kilo" class="{{c:range}}">
              </div>
              <div>
                <div class="flex items-end justify-between gap-4 mb-2.5">
                  <label class="{{c:label}} mb-0" for="water-exercise" data-i18n="tools.exercise">Günlük egzersiz</label>
                  <div class="relative w-32">
                    <input class="{{c:input}} pe-10" id="water-exercise" name="exercise" type="number" inputmode="numeric" min="0" max="240" step="5" value="30">
                    <span class="absolute inset-y-0 end-0 grid w-10 place-content-center text-sm text-gray-500 dark:text-gray-300" data-i18n="tools.min">dk</span>
                  </div>
                </div>
                <input type="range" min="0" max="180" step="15" value="30" data-sync="exercise" data-i18n-attr="aria-label:tools.exercise" aria-label="Günlük egzersiz" class="{{c:range}}">
              </div>
              <fieldset>
                <legend class="{{c:label}}" data-i18n="tools.climate">Hava</legend>
                <div class="grid grid-cols-2 gap-3">
                  <label class="{{c:radioB}}"><input type="radio" name="climate" value="normal" class="{{c:radioBIn}}" checked><span class="{{c:radioBTx}}" data-i18n="tools.normal">Normal</span></label>
                  <label class="{{c:radioB}}"><input type="radio" name="climate" value="hot" class="{{c:radioBIn}}"><span class="{{c:radioBTx}}" data-i18n="tools.hot">Sıcak / nemli</span></label>
                </div>
              </fieldset>
              <fieldset>
                <legend class="{{c:label}}" data-i18n="tools.status">Özel durum</legend>
                <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
                  <label class="{{c:radioB}}"><input type="radio" name="status" value="none" class="{{c:radioBIn}}" checked><span class="{{c:radioBTx}}" data-i18n="tools.none">Yok</span></label>
                  <label class="{{c:radioB}}"><input type="radio" name="status" value="pregnant" class="{{c:radioBIn}}"><span class="{{c:radioBTx}}" data-i18n="tools.pregnant">Gebelik</span></label>
                  <label class="{{c:radioB}}"><input type="radio" name="status" value="nursing" class="{{c:radioBIn}}"><span class="{{c:radioBTx}}" data-i18n="tools.nursing">Emzirme</span></label>
                </div>
              </fieldset>
            </form>
            <div class="tool-result grid content-start gap-4 {{c:cardPad}}" data-result="water" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </section>
