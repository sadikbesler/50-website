<!-- Kaynak: https://preline.co/docs/checkbox.html#checkboxes-with-descriptions · HTML sekmesinden okundu 2026-09-26 -->
<div class="max-w-sm w-full space-y-3">
  <div class="relative flex items-start">
    <div class="flex items-center h-5 mt-1">
      <input id="hs-checkbox-delete" name="hs-checkbox-delete" type="checkbox" class="shrink-0 size-4 bg-transparent border-line-3 rounded-sm shadow-2xs text-primary focus:ring-0 focus:ring-offset-0 checked:bg-primary-checked checked:border-primary-checked disabled:opacity-50 disabled:pointer-events-none" aria-describedby="hs-checkbox-delete-description" checked>
    </div>
    <label for="hs-checkbox-delete" class="ms-3">
      <span class="block text-sm font-semibold text-foreground">Delete</span>
      <span id="hs-checkbox-delete-description" class="block text-sm text-muted-foreground-2">Notify me when this action happens.</span>
    </label>
  </div>
  <div class="relative flex items-start">
    <div class="flex items-center h-5 mt-1">
      <input id="hs-checkbox-archive" name="hs-checkbox-archive" type="checkbox" class="shrink-0 size-4 bg-transparent border-line-3 rounded-sm shadow-2xs text-primary focus:ring-0 focus:ring-offset-0 checked:bg-primary-checked checked:border-primary-checked disabled:opacity-50 disabled:pointer-events-none" aria-describedby="hs-checkbox-archive-description">
    </div>
    <label for="hs-checkbox-archive" class="ms-3">
      <span class="block text-sm font-semibold text-foreground">Archive</span>
      <span id="hs-checkbox-archive-description" class="block text-sm text-muted-foreground-2">Notify me when this action happens.</span>
    </label>
  </div>
</div>
